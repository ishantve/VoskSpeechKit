name: CI
on:
  push: { branches: [ main ] }
  pull_request:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - name: Build (iOS Simulator)
        run: >
          xcodebuild build
          -scheme VoskSpeechKit
          -destination 'platform=iOS Simulator,name=iPhone 15'
      - name: Build FFI (iOS Simulator)
        run: >
          xcodebuild build
          -scheme VoskSpeechFFI
          -destination 'platform=iOS Simulator,name=iPhone 15'
